<style>
/* Layout: coluna única de app (até 600px), barra fixa com abas Dia/Semana/Mês, cartões por refeição na ordem do relógio */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#E8F7EF; --line:#D9E2E7;
  --fg:#0B2E3D; --muted:#4D6672; --accent:#15803D; --accent-ink:#FFFFFF; --accent-soft:#DCF5E6;
  --btn:#22C55E; --btn-ink:#0B2E3D; --brand:#0B2E3D; --brand2:#16A34A; --lime:#A3E635;
  --ok:#15803D; --ok-soft:#DCF5E6; --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#B3261E; --bad-soft:#F9DEDB; --idle:#7F8E96; --idle-soft:#E9EEF1; --water:#1F6FB2; --water-soft:#DCEAF7; --fire:#B4470F; --fire-soft:#FBE6D8;
  --display:Montserrat,"Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:Inter,"Helvetica Neue",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071E28; --surface:#0D2A36; --surface2:#123542; --line:#1E4655;
  --fg:#E6F4EE; --muted:#9DB6BF; --accent:#4ADE80; --accent-ink:#0B2E3D; --accent-soft:#103B33;
  --btn:#A3E635; --btn-ink:#0B2E3D; --brand:#E6F4EE; --brand2:#A3E635; --lime:#A3E635;
  --ok:#4ADE80; --ok-soft:#0F3A2C; --warn:#F0B562; --warn-soft:#3A2C12; --bad:#F2918A; --bad-soft:#3E1D1A; --idle:#86A0AA; --idle-soft:#14313C; --water:#7DB8EC; --water-soft:#12304A; --fire:#F59A62; --fire-soft:#3A2214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071E28; --surface:#0D2A36; --surface2:#123542; --line:#1E4655;
  --fg:#E6F4EE; --muted:#9DB6BF; --accent:#4ADE80; --accent-ink:#0B2E3D; --accent-soft:#103B33;
  --btn:#A3E635; --btn-ink:#0B2E3D; --brand:#E6F4EE; --brand2:#A3E635; --lime:#A3E635;
  --ok:#4ADE80; --ok-soft:#0F3A2C; --warn:#F0B562; --warn-soft:#3A2C12; --bad:#F2918A; --bad-soft:#3E1D1A; --idle:#86A0AA; --idle-soft:#14313C; --water:#7DB8EC; --water-soft:#12304A; --fire:#F59A62; --fire-soft:#3A2214; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.3px}
.brand small{color:var(--muted);font-size:12px}
.logo{display:flex;align-items:center;gap:6px;color:var(--brand)}.logo svg{width:30px;height:30px;flex:none}
.logo span{font-family:var(--display);font-style:italic;font-weight:800;font-size:23px;letter-spacing:-.6px;line-height:1}.logo b{color:var(--brand2);font-weight:800}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface2);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;padding:8px 0;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .lbl{font-weight:900;text-align:center;flex:1;min-width:0;text-transform:capitalize}
.iconbtn{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.todaybtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;flex:none}
main{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.hero{display:flex;flex-direction:column;gap:10px}
.hero .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-1px}
.big span{font-size:16px;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:4px}
.sub{color:var(--muted);font-size:13px}
.bar{height:10px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.bar i.over{background:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;padding:5px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok);background:var(--ok-soft)}
.s-warn{color:var(--warn);background:var(--warn-soft)}
.s-bad{color:var(--bad);background:var(--bad-soft)}
.s-idle{color:var(--idle);background:var(--idle-soft)}
.primary{border:0;background:var(--btn);color:var(--btn-ink);border-radius:12px;padding:12px 14px;font-weight:900;min-height:44px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;min-height:40px}
.ghost.on{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.meal{display:flex;flex-direction:column;gap:10px;padding:0;overflow:hidden}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 14px 0}
.mtime{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.5px;flex:none}
.mname{font-weight:900;flex:1;min-width:0}

.choices{display:flex;flex-wrap:wrap;gap:5px}

.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.tip{font-size:13px;color:var(--muted)}
.extras{display:flex;flex-direction:column;gap:6px}

.extra .x{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--warn);font-weight:900}
.addx{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:6px}
.addx input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
.addx button{border:0;background:var(--fg);color:var(--bg);border-radius:10px;padding:0 12px;font-weight:900;min-height:40px}
.mactions{display:flex;gap:8px;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.3px;text-wrap:balance}
.sum{display:flex;flex-direction:column;gap:12px}
.lines{display:flex;flex-direction:column}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.line:first-child{border-top:0}
.line span:last-child{font-weight:900;text-align:right}
.verdict{font-size:15px;font-weight:700;padding:12px;border-radius:12px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.tile span{font-size:12.5px;color:var(--muted)}
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:170px;align-items:end;position:relative;padding-top:6px}
.chart .col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;background:transparent;border:0;padding:0}
.chart .b{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;min-height:2px}
.chart .d{font-size:11.5px;color:var(--muted);font-weight:700}
.chart .v{font-size:10.5px;color:var(--muted)}
.ref{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.6;pointer-events:none}
.ref em{position:absolute;right:0;top:-18px;font-style:normal;font-size:11px;color:var(--muted);background:var(--surface);padding:0 4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:11px;font-weight:900;color:var(--muted);text-align:center;text-transform:uppercase}
.cal button{aspect-ratio:1/1;max-width:100%;border:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:900;font-size:14px;padding:0}
.cal button small{font-size:9.5px;font-weight:700;opacity:.85}
.cal button.today{outline:2px solid var(--fg);outline-offset:-2px}
.daylist{display:flex;flex-direction:column}
.dayrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.dayrow:first-child{border-top:0}
.dayrow .dn{font-weight:700;text-transform:capitalize}
.note{font-size:12px;color:var(--muted);text-align:center}
.banner{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--fg)}
.s-water{color:var(--water);background:var(--water-soft)}
.water{display:flex;flex-direction:column;gap:12px}
.water .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.wbig{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.8px;color:var(--water)}
.wbig span{font-size:16px;font-weight:600;letter-spacing:0;color:var(--muted)}
.cups{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px}
.cups i{height:22px;border:1.5px solid var(--water);border-top-width:0;border-radius:2px 2px 6px 6px;opacity:.55}
.cups i.on{background:var(--water);opacity:1}
.wbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.wbtn{border:1.5px solid var(--water);background:var(--water-soft);color:var(--water);border-radius:12px;padding:8px 4px;font-weight:900;font-size:14px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;text-align:center}
.wbtn small{font-weight:700;font-size:11px;color:var(--muted)}
.wrow{display:flex;gap:8px;flex-wrap:wrap}
.addw{display:flex;gap:6px;flex:1 1 220px;min-width:0}
.addw input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:40px}
.addw button{border:0;background:var(--water);color:var(--surface);border-radius:10px;padding:0 12px;font-weight:900;min-height:40px}
.ghost:disabled{opacity:.45;cursor:default}
.cal button{position:relative}
.drop{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--water)}
.train{display:flex;flex-direction:column;gap:12px}
.thead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.tlist{display:flex;flex-direction:column}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow b{flex:1;min-width:0;font-weight:700}
.trow b small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.trow .k{font-weight:900;color:var(--fire)}
.trow .x{width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:900}
.tquick{display:flex;gap:6px;flex-wrap:wrap}
.tform{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1fr);gap:6px}
.tform select,.tform input,.pform input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:42px;width:100%;min-width:0}
.tform .go{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tform button{border:0;background:var(--fire);color:var(--surface);border-radius:10px;padding:0 14px;font-weight:900;min-height:42px}
.tprev{font-size:13px;color:var(--muted)}
.tprev b{color:var(--fire)}
.fbig{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.8px;color:var(--fire)}
.fbig span{font-size:16px;font-weight:600;letter-spacing:0;color:var(--muted)}
.bal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.bal div{background:var(--surface2);border-radius:12px;padding:10px 6px}
.bal b{display:block;font-family:var(--display);font-weight:800;font-size:20px}
.bal span{font-size:11.5px;color:var(--muted)}
.wt{display:flex;flex-direction:column;gap:10px}
.wt .row1{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.pform{display:flex;gap:6px}
.pform button{border:0;background:var(--fg);color:var(--bg);border-radius:10px;padding:0 14px;font-weight:900;min-height:42px;flex:none}
details.prof summary{cursor:pointer;font-weight:900;min-height:32px;display:flex;align-items:center}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.pgrid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:700}
.pgrid input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:42px;width:100%;min-width:0;color:var(--fg)}
.wchart{width:100%;height:auto;display:block}
@media (prefers-reduced-motion: no-preference){.bar i,.chart .b{transition:width .25s ease,height .25s ease}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
input,select,textarea{font-size:16px}
.brand{align-items:center}
.brand>div:first-child{min-width:0}
.brand small{display:block}
.who{display:flex;align-items:center;gap:8px;flex:none}
.login{display:flex;flex-direction:column;gap:12px}
.lform{display:flex;flex-direction:column;gap:10px}
.lform label,.tools label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.lform input,.tools textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:46px;color:var(--fg);width:100%;min-width:0}
.tools textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.lbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0;text-align:left;min-height:36px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.gbtn{min-height:46px}
.lmsg{margin:0;font-size:13.5px;color:var(--bad);min-height:1em}
.lmsg.ok{color:var(--ok)}
.tools{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.tools .row{display:flex;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .primary{padding:0 14px}
.lform .chk{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;color:var(--fg);font-size:14px;line-height:1.45}
.lform .chk input{width:22px;height:22px;min-height:0;flex:none;margin-top:1px;padding:0;accent-color:var(--accent)}
.linkbtn.inline{padding:0;min-height:0;display:inline;font-size:inherit;text-decoration:underline}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.paybox{background:var(--surface2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pixkey{font-size:17px;font-weight:900;overflow-wrap:anywhere;-webkit-user-select:all;user-select:all}
.btnlink{display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.legalinks{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.legalinks .linkbtn{min-height:32px;padding:4px 0}
.danger{background:var(--bad-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.danger p{margin:0;font-size:13.5px}
.dangerbtn{border:0;background:var(--bad);color:var(--surface);border-radius:10px;padding:0 14px;font-weight:900;min-height:42px}
.legal{display:flex;flex-direction:column;gap:6px;line-height:1.55}
.legal h3{font-size:15px;margin:12px 0 0}
.legal p{margin:0;font-size:14.5px}
.legal > button{align-self:flex-start}
.client{display:flex;flex-direction:column;gap:10px}
.card a{color:var(--accent);font-weight:700}
.card a.primary{color:var(--btn-ink);text-decoration:none}
.eyebrow{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:var(--fire)}
.tcard,.thero{display:flex;flex-direction:column;gap:10px}
.tcard h2,.thero h2{margin-top:2px}
.donerow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--ok-soft);border-radius:12px;padding:10px 12px;min-height:52px}
.donerow small{display:block;color:var(--muted);font-size:12.5px}
.donerow .ok-dot{width:28px;height:28px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center;font-weight:900;flex:none}
.donerow > span:nth-child(2){flex:1;min-width:0}
.tclock{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.5px;color:var(--fire)}
.prep{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--surface2);border-radius:10px;padding:10px 12px}
.prep input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.exc{display:flex;flex-direction:column;gap:6px}
.exn{font-size:16px}
.exobs{font-size:13px;color:var(--fg);background:var(--warn-soft);border-radius:8px;padding:6px 8px;margin-top:6px}
.sethead,.setrow{display:grid;grid-template-columns:36px minmax(0,1fr) 72px 64px 44px;gap:6px;align-items:center}
.sethead{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:0 2px}
.setrow{padding:4px 2px;border-radius:10px}
.setrow.done{background:var(--ok-soft)}
.setrow.warm .sn{color:var(--muted)}
.setrow .sn{font-weight:900;text-align:center}
.setrow .prev{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px;min-height:40px;width:100%;min-width:0;text-align:center;color:var(--fg)}
.setrow input:disabled{opacity:.8}
.check.sm{width:40px;height:40px}
.prb{color:var(--warn)}
.exfoot{align-items:center;margin-top:4px}
.ghost.sm{min-height:36px;padding:6px 10px;font-size:12.5px}
.exgroup{display:flex;align-items:baseline;gap:10px;padding:6px 2px 0}
.addx2{width:100%}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:hidden}
.restbar .rfill{position:absolute;inset:0 auto 0 0;background:var(--fire);opacity:.35;width:0}
.restbar > *{position:relative}
.restbar .rlbl{font-size:13px;font-weight:700;opacity:.8}
.restbar .rt{font-family:var(--display);font-size:24px;flex:1}
.restbar button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:10px;padding:8px 12px;font-weight:900;min-height:40px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:min(520px,calc(100% - 32px));box-shadow:0 6px 24px rgba(0,0,0,.25)}
body{padding-bottom:72px}
.cname{font-size:16px}
.admq{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;color:var(--fg)}

/* editor de plano e ficha */
.eg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ef{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
.ef.w{grid-column:1/-1}
.ef input,.ef select,.ef textarea,.ech input,.ew{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:42px;color:var(--fg);width:100%;min-width:0;font-family:inherit;font-size:16px;font-weight:400}
.ef textarea{min-height:70px;resize:vertical}
.edd>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:44px}
.edd>summary::-webkit-details-marker{display:none}
.edd>summary::before{content:'\25B8';color:var(--muted)}
.edd[open]>summary::before{content:'\25BE'}
.edb{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.eopt{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.eoh{display:flex;gap:8px;align-items:flex-end}.eoh .ef{flex:1}
.eitem{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.eih{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;font-size:13px}.eih .eb{min-width:34px;padding:4px 8px}
.eih .sp,.row .sp{flex:1}
.ck{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.ck input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.ew{width:58px!important;min-height:34px!important;padding:4px 8px!important}
.ech{display:grid;grid-template-columns:minmax(0,1fr) 72px 58px 36px;gap:6px;align-items:center}
.ech.alt input:first-child{border-style:dashed}
.eb{min-height:36px;padding:4px 10px;font-size:13px}
.eb.add{color:var(--accent);border-style:dashed}
.eb.big{flex:1;min-height:46px;font-size:14px}
.eb.danger{color:var(--bad);border-color:var(--bad)}
.erow.end{justify-content:flex-end;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.edsave{position:sticky;bottom:8px;z-index:5;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.eg.ag{grid-template-columns:repeat(4,minmax(0,1fr))}
.selfed{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:360px){.ech{grid-template-columns:minmax(0,1fr) 68px 56px 36px}.eg{grid-template-columns:1fr}}

.card a.ghost.relbtnl{color:var(--fg)}

.rbrand{font-weight:900;letter-spacing:1px;font-size:11px;color:#0B2E3D}

<script>
(function(){
/* ---------- Plano (quantidades da nutricionista; kcal aproximadas pela tabela TACO e rótulos) ---------- */
let PLAN = [];
let PLANINFO = null;
const FOODS = [
 ['Pão de queijo médio',145],['Coxinha',230],['Pastel',280],['Salgado assado',200],['Esfiha',180],['Pizza (1 fatia)',280],['Hambúrguer',500],['Cachorro-quente',400],['Batata frita (porção média)',360],['Sanduíche natural',250],
 ['Brigadeiro',90],['Bolo (1 fatia)',300],['Torta doce (1 fatia)',350],['Pudim (1 fatia)',250],['Chocolate (25 g)',135],['Sorvete (1 bola)',140],['Biscoito recheado (3 un)',150],['Açaí 300 ml com granola',450],
 ['Refrigerante lata',140],['Suco de laranja 300 ml',135],['Cerveja lata',150],['Vinho (1 taça)',125],['Caipirinha',200],['Café com açúcar',25],
 ['Arroz branco (4 c. sopa)',128],['Feijão (1 concha)',61],['Farofa (2 c. sopa)',110],['Frango frito (1 pedaço)',250],['Churrasco (150 g)',400],['Ovo frito',105],['Tapioca simples',160],['Cuscuz (100 g)',113],
 ['Banana',90],['Maçã',75],['Mamão (1 fatia)',60],['Castanhas (30 g)',180],['Pão francês extra',150]
];
const MEAL_STATUS = {ok:['No plano','s-ok'], adj:['Ajustado','s-warn'], extra:['Com extra','s-warn'], skip:['Pulou','s-bad'], pend:['Pendente','s-idle']};
const DAY_STATUS = {plano:['Fiz tudo','s-ok'], fora:['Não fiz tudo','s-bad'], andamento:['Em andamento','s-idle'], vazio:['Sem registro','s-idle']};
let WATER_GOAL = 2000;
/* MET (Compêndio de Atividades Físicas): leve, moderada, intensa. Gasto do treino = (MET − 1) × peso × horas, ou seja, o que o treino queima a mais que o repouso */
const ACTS = {
 musculacao:{n:'Musculação', met:[3.5,5,6]},
 beach:{n:'Beach tennis', met:[5,7,8]},
 caminhada:{n:'Caminhada', met:[3.5,4.5,5]}, /* leve ≈ 4,8 km/h · moderada ≈ 6 km/h · intensa ≈ 6,5 km/h */
 corrida:{n:'Corrida', met:[7,9,11]},
 bike:{n:'Bicicleta', met:[4,6.8,8.5]},
 natacao:{n:'Natação', met:[5.8,7,9.8]},
 funcional:{n:'Funcional / HIIT', met:[4,6,8]},
 futebol:{n:'Futebol', met:[6,7,10]},
 outro:{n:'Outro cardio', met:[4,6,8]}
};
const INT = ['Leve','Moderada','Intensa'];
const PROF_DEF = {altura:null, idade:null, tmb:null, fator:1.2, meta:null};
const fmtKg = n => (Math.round(n*10)/10).toLocaleString('pt-BR');
const fmtL = ml => (ml/1000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2});
let REF = 0;
function computeRef(){return PLAN.reduce((s,m)=>s+m.options[0].items.filter(i=>!i.opt).reduce((a,i)=>a+i.ch[0][2],0),0);}
function validPlan(p){return p&&Array.isArray(p.meals)&&p.meals.length&&p.meals.every(m=>m&&m.id&&m.name&&Array.isArray(m.options)&&m.options.length&&m.options.every(o=>Array.isArray(o.items)&&o.items.every(it=>it&&it.k&&Array.isArray(it.ch)&&it.ch.length)));}
function setPlan(p){PLANINFO=p||null; PLAN=p?p.meals:[]; REF=computeRef(); const n=document.getElementById('nutri'); if(n) n.textContent=p&&p.nutri?'Plano de '+p.nutri:'Checklist diário de saúde';}

/* ---------- Estado ---------- */
const S = {view:'dia', tab:'inicio', aj:ajVazio(), date:ymd(new Date()), days:{}, custom:[], db:null, local:false, timers:{}, ready:false, prof:{...PROF_DEF}, tf:{t:'musculacao',min:60,i:1}, profOpen:false};
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
const fmt = n => Math.round(n).toLocaleString('pt-BR');
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => ymd(new Date());

function day(date){return S.days[date] || {meals:{}}}
function rec(date,mid,create){
  const d = S.days[date] || (create ? (S.days[date]={meals:{}}) : null);
  if(!d) return null;
  if(!d.meals) d.meals={};
  if(!d.meals[mid] && create) d.meals[mid]={opt:0,items:{},extras:[],skip:false};
  return d.meals[mid]||null;
}
function itemRec(r,oi,k){return (r && r.items && r.items[oi+'.'+k]) || {on:false,c:0,m:1}}

function mealCalc(meal,r){
  if(!r) return {kcal:0,planK:0,extraK:0,status:'pend'};
  const extraK=(r.extras||[]).reduce((a,e)=>a+(+e.kcal||0),0);
  if(r.skip) return {kcal:extraK,planK:0,extraK,status:extraK?'extra':'skip'};
  const oi=r.opt||0, opt=meal.options[oi]||meal.options[0];
  let planK=0, all=true, any=false, adj=false;
  opt.items.forEach(it=>{
    const ir=itemRec(r,oi,it.k);
    if(ir.on){any=true; planK+=(it.ch[ir.c||0]||it.ch[0])[2]*(ir.m||1); if((ir.m||1)!==1) adj=true;}
    else if(!it.opt) all=false;
  });
  let status = !any && !extraK ? 'pend' : extraK ? 'extra' : (all && !adj) ? 'ok' : 'adj';
  return {kcal:planK+extraK,planK,extraK,status};
}
function dayCalc(date){
  const d=day(date); const meals=PLAN.map(m=>({m,c:mealCalc(m,(d.meals||{})[m.id])}));
  const kcal=meals.reduce((a,x)=>a+x.c.kcal,0), extraK=meals.reduce((a,x)=>a+x.c.extraK,0);
  const ok=meals.filter(x=>x.c.status==='ok').length, pend=meals.filter(x=>x.c.status==='pend').length;
  const water=waterMl(date), waterOk=water>=WATER_GOAL;
  let status = (pend===PLAN.length && !water) ? 'vazio' : (ok===PLAN.length && waterOk) ? 'plano' : (date===today() && (pend>0 || !waterOk)) ? 'andamento' : 'fora';
  const extras=[]; meals.forEach(x=>(((d.meals||{})[x.m.id]||{}).extras||[]).forEach(e=>extras.push({...e,meal:x.m.name})));
  const tr=trainCalc(date), base=baseBurn(), gasto=base+tr.kcal, saldo=kcal-gasto;
  return {meals,kcal,extraK,ok,pend,status,extras,water,waterOk,tr,base,gasto,saldo};
}
function weightList(){return Object.keys(S.days).sort().filter(k=>+S.days[k].peso>0).map(k=>({d:k,w:+S.days[k].peso}));}
function weightOn(date){let w=null,wd=null; weightList().forEach(x=>{if(x.d<=date){w=x.w;wd=x.d;}}); if(!w){const l=weightList(); if(l.length){w=l[0].w;wd=l[0].d;}} return {w,wd};}
function trainK(t,kg){const a=ACTS[t.t]||ACTS.outro, met=a.met[t.i==null?1:t.i]||a.met[1]; return Math.max(0,(met-1)*kg*(+t.min||0)/60);}
function trainCalc(date){const d=day(date), ts=Array.isArray(d.treinos)?d.treinos:[], kg=weightOn(date).w||0; const list=ts.map(t=>({...t,kcal:trainK(t,kg)})); return {list,kcal:list.reduce((a,x)=>a+x.kcal,0),min:list.reduce((a,x)=>a+(+x.min||0),0),kg};}
function baseBurn(){return S.prof.tmb ? S.prof.tmb*(S.prof.fator||1.2) : 0;}
function waterMl(date){
  const d=day(date), logs=(Array.isArray(d.agua)?d.agua:[]).reduce((a,x)=>a+(+x||0),0);
  let base=0;
  PLAN.forEach(m=>{const r=(d.meals||{})[m.id]; if(!r||r.skip) return; const oi=r.opt||0; ((m.options[oi]||m.options[0]).items||[]).forEach(it=>{ if(it.w){const ir=itemRec(r,oi,it.k); if(ir.on) base+=it.w*(ir.m||1);} });});
  return logs+base;
}

/* ---------- Persistência ---------- */
function save(date){
  clearTimeout(S.timers[date]);
  S.timers[date]=setTimeout(async()=>{
    delete S.timers[date];
    const body=JSON.parse(JSON.stringify(S.days[date]||{meals:{}}));
    if(S.db){ try{ await S.db.doc('dias/'+date).set(body);}catch(e){ banner('Não consegui salvar agora. Vou tentar de novo na próxima alteração.'); } }
    else { try{ localStorage.setItem('diario-dias',JSON.stringify(S.days)); }catch(e){} }
  },450);
}
async function saveCustom(){
  if(S.db){ try{ await S.db.doc('config/alimentos').set({lista:S.custom}); }catch(e){} }
  else { try{ localStorage.setItem('diario-alimentos',JSON.stringify(S.custom)); }catch(e){} }
}

function banner(m){bannerMsg=m;render()}

const TERMS_V = '2026-11-04';
const TERMS_DATA = '04/11/2026';
const DAY_MS = 864e5;
const TS = d => firebase.firestore.Timestamp.fromDate(d);
const NOW_FS = () => firebase.firestore.FieldValue.serverTimestamp();
const toDate = v => (v && typeof v.toDate === 'function') ? v.toDate() : (v ? new Date(v) : null);
const dBR = d => d ? d.toLocaleDateString('pt-BR') : '—';
const money = v => (+v || 0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const onlyDigits = s => String(s || '').replace(/\D+/g, '');
function cfg(){ return S.cfg || {}; }

function accessOf(sub){
  if(!sub) return {ok:false, kind:'pendente'};
  if(sub.vitalicio) return {ok:true, kind:'vitalicio'};
  const t = toDate(sub.ativoAte);
  if(t && t > new Date()) return {ok:true, kind:'ativo', ate:t, dias:Math.ceil((t - new Date())/DAY_MS)};
  if(sub.bloqueado) return {ok:false, kind:'bloqueado', ate:t};
  if(t) return {ok:false, kind:'vencido', ate:t};
  return {ok:false, kind:'pendente'};
}
function access(){ return S.isAdmin ? {ok:true, kind:'admin'} : accessOf(S.sub); }

function mount(key, html, sticky){
  const app = document.getElementById('app');
  if(sticky && S.lastView === key && document.getElementById('view-' + key)) return;
  const same = S.lastView === key, keep = {}, act = document.activeElement, actId = act && app.contains(act) ? act.id : '';
  let caret = null; try{ if(actId && typeof act.selectionStart === 'number') caret = act.selectionStart; }catch(e){}
  if(same) app.querySelectorAll('input[id],textarea[id]').forEach(el => { if(el.type === 'file' || el.dataset.sedit || el.dataset.ep) return; keep[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
  app.innerHTML = html; S.lastView = key;
  if(same){
    Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if(!el) return; if(el.type === 'checkbox') el.checked = v; else el.value = v; });
    if(actId){ const el = document.getElementById(actId); if(el){ el.focus(); try{ if(caret != null) el.setSelectionRange(caret, caret); }catch(e){} } }
  }
}

async function deleteAccount(){
  const say = t => { S.delMsg = t; const el = document.getElementById('delmsg'); if(el) el.textContent = t; };
  const u = AUTH.currentUser; if(!u) return;
  say('Apagando seus dados…');
  try{
    const base = FS.collection('users').doc(u.uid);
    for(const c of ['dias','config']){
      const snap = await base.collection(c).get();
      let b = FS.batch(), n = 0;
      for(const d of snap.docs){ b.delete(d.ref); n++; if(n === 400){ await b.commit(); b = FS.batch(); n = 0; } }
      if(n) await b.commit();
    }
    await FS.collection('clientes').doc(u.uid).delete();
  }catch(e){ say('Não consegui apagar agora. Verifique a internet e tente de novo.'); return; }
  try{ await u.delete(); S.confirmDel = false; S.delMsg = ''; }
  catch(e){
    if(e.code === 'auth/requires-recent-login'){ say('Seus dados foram apagados. Para concluir a exclusão do login, toque em Sair, entre de novo e repita.'); }
    else say('Seus dados foram apagados, mas não consegui remover o login. Tente de novo mais tarde.');
  }
}

function metaDia(date, c){

/* ---------- Meus ajustes: pequenas mudanças do cliente por cima do plano e da ficha do profissional ---------- */
function ajVazio(){ return {plano:{trocas:{}, opcoes:{}, horario:{}}, treino:{troca:{}, extra:{}}}; }
function ajNorm(a){ const v = ajVazio(); a = a || {}; ['trocas', 'opcoes', 'horario'].forEach(k => { v.plano[k] = (a.plano && a.plano[k]) || {}; }); ['troca', 'extra'].forEach(k => { v.treino[k] = (a.treino && a.treino[k]) || {}; }); return v; }
function mergePlan(base, aj){
  if(!base) return null; const p = JSON.parse(JSON.stringify(base)), A_ = (aj && aj.plano) || {};
  p.meals.forEach(m => {
    const h = (A_.horario || {})[m.id]; if(h) m.time = h;
    const tr = (A_.trocas || {})[m.id] || {};
    m.options.forEach((o, oi) => o.items.forEach(it => { (tr[oi + '.' + it.k] || []).forEach(c => it.ch.push([c[0], c[1] || '', +c[2] || 0, 1])); }));
    ((A_.opcoes || {})[m.id] || []).forEach(o => { if(o && Array.isArray(o.items) && o.items.length) m.options.push({label:o.label || 'Minha opção', aj:1, items:o.items.map(i => ({k:i.k, opt:i.opt, ch:i.ch.map(c => [c[0], c[1] || '', +c[2] || 0, 1])}))}); });
  });
  p.meals.sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')));
  return p;
}
function mergeTreino(base, aj){
  if(!base) return null; const t = JSON.parse(JSON.stringify(base)), A_ = (aj && aj.treino) || {};
  t.fichas.forEach(f => {
    const tr = (A_.troca || {})[f.id] || {};
    f.ex = f.ex.map(e => { const n = tr[slug(e.n)]; return n && n.n ? {...e, n:n.n, t:n.t || e.t, _orig:e.n, aj:1} : e; });
    ((A_.extra || {})[f.id] || []).forEach(e => { if(e && e.n) f.ex.push({n:e.n, t:e.t || 'multi', s:Array.isArray(e.s) ? e.s : [[3, '10–12']], aj:1}); });
  });
  return t;
}
function aplicaAjustes(){
  if(S.planBase !== undefined) setPlan(S.planBase && validPlan(S.planBase) ? mergePlan(S.planBase, S.aj) : null);
  if(S.treinoBase !== undefined){ const t = S.treinoBase && validTreino(S.treinoBase) ? mergeTreino(S.treinoBase, S.aj) : null; S.treino = t && validTreino(t) ? t : (S.treinoBase && validTreino(S.treinoBase) ? S.treinoBase : null); }
}

function ajLinhas(aj, base, tbase){
  aj = ajNorm(aj); const L = [], mealNome = id => { const m = base && base.meals.find(x => x.id === id); return m ? m.name : 'Refeição'; };
  Object.entries(aj.plano.horario).forEach(([id, h]) => { const m = base && base.meals.find(x => x.id === id); L.push(`${mealNome(id)}: horário ${m && m.time ? m.time + ' → ' : ''}${h}`); });
  Object.entries(aj.plano.trocas).forEach(([id, o]) => Object.entries(o).forEach(([key, arr]) => { const [oi, k] = key.split('.'), m = base && base.meals.find(x => x.id === id), it = m && m.options[+oi] && m.options[+oi].items.find(i => i.k === k), orig = it ? it.ch[0][0] : 'item';
    (arr || []).forEach(c => L.push(`${mealNome(id)}: troca para "${orig}" → ${c[0]}${c[1] ? ' (' + c[1] + ')' : ''}, ${fmt(+c[2] || 0)} kcal`)); }));
  Object.entries(aj.plano.opcoes).forEach(([id, arr]) => (arr || []).forEach(o => L.push(`${mealNome(id)}: nova opção "${o.label}" — ${o.items.map(i => i.ch[0][0] + (i.ch[0][1] ? ' ' + i.ch[0][1] : '')).join(', ')} (${fmt(o.items.reduce((a, i) => a + (+i.ch[0][2] || 0), 0))} kcal)`)));
  Object.entries(aj.treino.troca).forEach(([fid, o]) => Object.entries(o).forEach(([sl, n]) => { const f = tbase && tbase.fichas.find(x => x.id === fid), e = f && f.ex.find(x => slug(x.n) === sl); L.push(`Treino ${fid}: "${e ? e.n : sl}" trocado por "${n.n}"`); }));
  Object.entries(aj.treino.extra).forEach(([fid, arr]) => (arr || []).forEach(e => L.push(`Treino ${fid}: exercício adicionado "${e.n}"${Array.isArray(e.s) ? ' ' + specTxt(e.s) : ''}`)));
  return L;
}

const BIO = [['peso','Peso','kg'],['gord','Gordura corporal','%'],['mgord','Massa de gordura','kg'],['mmagra','Massa magra','kg'],['mmusc','Massa muscular','kg'],['agua','Água corporal','L'],['prot','Proteína','kg'],['mine','Minerais','kg'],['tmb','Metabolismo basal','kcal'],['visc','Gordura visceral','índice'],['imet','Idade metabólica','anos']];
const SEG = [['bE','Braço esquerdo'],['bD','Braço direito'],['tr','Tronco'],['pE','Perna esquerda'],['pD','Perna direita']];
const BIO_MENOS = ['peso','gord','mgord','visc','imet'], BIO_MAIS = ['mmagra','mmusc','prot','mine','agua','tmb'];
const f1 = v => v == null || v === '' || isNaN(v) ? '—' : (Math.round(v * 10) / 10).toLocaleString('pt-BR');
function bioList(){ return Object.keys(S.days).sort().filter(d => S.days[d].bio && Object.keys(S.days[d].bio).length).map(d => ({d, b:bioCalc(S.days[d].bio)})); }
function bioCalc(b){
  b = JSON.parse(JSON.stringify(b || {}));
  if(b.peso && b.gord && !b.mgord) b.mgord = Math.round(b.peso * b.gord) / 100;
  if(b.peso && b.mgord && !b.gord) b.gord = Math.round(b.mgord / b.peso * 1000) / 10;
  if(b.peso && b.mgord && !b.mmagra) b.mmagra = Math.round((b.peso - b.mgord) * 10) / 10;
  const alt = +S.prof.altura; if(b.peso && alt > 100) b.imc = Math.round(b.peso / Math.pow(alt / 100, 2) * 10) / 10;
  return b;
}
function bioUn(k){ const x = BIO.find(z => z[0] === k); return x ? x[2] : ''; }
function bioLab(k){ return k === 'imc' ? 'IMC' : (BIO.find(z => z[0] === k) || [k, k])[1]; }
function bioDelta(v, k, comCor){
  if(v == null || isNaN(v)) return '—'; const s = Math.abs(v) < 0.05 ? '0' : (v < 0 ? '−' : '+') + f1(Math.abs(v));
  const u = k === 'imc' ? '' : ' ' + bioUn(k); if(!comCor || Math.abs(v) < 0.05) return s + u;
  const bom = BIO_MENOS.includes(k) || k === 'imc' ? v < 0 : BIO_MAIS.includes(k) ? v > 0 : null;
  return bom == null ? s + u : `<span style="color:${bom ? 'var(--ok)' : 'var(--bad)'}">${s}${u}</span>`;
}

function bioSave(){
  const v = id => { const e = document.getElementById(id); const t = e ? e.value.trim() : ''; return t ? numv(t) : null; };
  const d = (document.getElementById('bio-date') || {}).value || today(), b = {};
  BIO.forEach(([k]) => { const x = v('bio-' + k); if(x != null && x > 0) b[k] = Math.round(x * 100) / 100; });
  const msg = t => { const e = document.getElementById('biomsg'); if(e) e.textContent = t; };
  if(!b.peso){ msg('Informe pelo menos o peso.'); return; }
  if(b.gord && (b.gord < 2 || b.gord > 70)){ msg('Confira o % de gordura.'); return; }
  const seg = {g:{}, m:{}}; SEG.forEach(([k]) => ['g', 'm'].forEach(t => { const kg = v(`sg-${t}-${k}-kg`), p = v(`sg-${t}-${k}-p`); if(kg || p){ seg[t][k] = {}; if(kg) seg[t][k].kg = kg; if(p) seg[t][k].p = p; } }));
  if(Object.keys(seg.g).length || Object.keys(seg.m).length){ b.seg = {}; if(Object.keys(seg.g).length) b.seg.g = seg.g; if(Object.keys(seg.m).length) b.seg.m = seg.m; }
  const imp = {}; ['5', '50'].forEach(fq => SEG.forEach(([k]) => { const x = v(`im-${fq}-${k}`); if(x){ imp[fq] = imp[fq] || {}; imp[fq][k] = x; } })); if(Object.keys(imp).length) b.imp = imp;
  const sexo = (document.getElementById('bio-sexo') || {}).value || '', usaTmb = (document.getElementById('bio-tmbp') || {}).checked;
  if(S.bioDate && S.bioDate !== d && S.days[S.bioDate] && S.days[S.bioDate].bio){ delete S.days[S.bioDate].bio; save(S.bioDate); }
  const day_ = S.days[d] || (S.days[d] = {meals:{}}); day_.bio = b;
  if(!+day_.peso) day_.peso = b.peso;
  save(d);
  let mudouPerfil = false; if(sexo && sexo !== S.prof.sexo){ S.prof.sexo = sexo; mudouPerfil = true; } if(usaTmb && b.tmb && b.tmb !== S.prof.tmb){ S.prof.tmb = b.tmb; mudouPerfil = true; }
  if(mudouPerfil) saveProf();
  S.mode = 'app'; S.tab = 'evol'; S.bioDate = null; toast('Avaliação salva.'); render(); window.scrollTo(0, 0);
}
function bioDel(d){ if(S.bioConf !== d){ S.bioConf = d; render(); return; } S.bioConf = null; if(S.days[d]){ delete S.days[d].bio; save(d); } S.mode = 'app'; S.tab = 'evol'; toast('Avaliação apagada.'); render(); }

function bioMesSecao(ini, fim){

    ${ks.map(k => `<tr><td>${bioLab(k)}</td>${a !== z ? `<td>${f1(a.b[k])}</td>` : ''}<td>${f1(z.b[k])} ${bioUn(k)}</td>${a !== z ? `<td>${a.b[k] != null ? bioDelta(z.b[k] - a.b[k], k, true) : '—'}</td>` : ''}</tr>`).join('')}</tbody></table></section>`;
}

const IC = {navy:'#0B2E3D', navy2:'#11505A', green:'#22C55E', lime:'#A3E635', dg:'#15803D', fg:'#0B2E3D', mut:'#5B7280', line:'#DCE5EA', soft:'#F2F6F8', okBg:'#E3F7EA', okFg:'#15803D', badBg:'#FDE4E2', badFg:'#C0392B', warnBg:'#FDF1D6', warnFg:'#A15C00', orange:'#F59E0B'};
const IFH = 'Montserrat, "Avenir Next", system-ui, sans-serif', IFB = 'Inter, "Helvetica Neue", Arial, sans-serif';
function icRR(x, a, b, w, h, r){ x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
function icT(x, s, a, b, o){ o = o || {}; x.font = (o.w || 400) + ' ' + (o.s || 16) + 'px ' + (o.h ? IFH : IFB); x.fillStyle = o.c || IC.fg; x.textAlign = o.al || 'left'; x.textBaseline = 'alphabetic'; if(o.max){ let t = String(s); while(x.measureText(t).width > o.max && t.length > 3) t = t.slice(0, -2) + '…'; s = t; } x.fillText(String(s), a, b); x.textAlign = 'left'; }
function icPanel(x, a, b, w, h, title){
  x.save(); x.shadowColor = 'rgba(11,46,61,.10)'; x.shadowBlur = 14; x.shadowOffsetY = 4; x.fillStyle = '#fff'; icRR(x, a, b, w, h, 18); x.fill(); x.restore();
  x.strokeStyle = IC.line; x.lineWidth = 1.5; icRR(x, a, b, w, h, 18); x.stroke();
  const g = x.createLinearGradient(a, 0, a + w, 0); g.addColorStop(0, '#EAF4F1'); g.addColorStop(1, '#F6FAFB'); x.fillStyle = g; icRR(x, a + 6, b + 6, w - 12, 46, 12); x.fill();
  x.fillStyle = IC.navy; icRR(x, a + 14, b + 13, 32, 32, 9); x.fill();
  x.strokeStyle = IC.lime; x.lineWidth = 3; x.lineCap = 'round'; x.lineJoin = 'round'; x.beginPath(); x.moveTo(a + 22, b + 29); x.lineTo(a + 28, b + 35); x.lineTo(a + 39, b + 22); x.stroke();
  icT(x, title, a + 56, b + 37, {s:21, w:800, h:1, max:w - 70});

}

/* ---------- Busca de alimentos (tabela TACO, Unicamp) ---------- */
const semAc = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const TACO_IX = TACO.map(t => semAc(t[0]).replace(/,/g, ' '));
function tacoBusca(q, max){
  const w = semAc(q).replace(/,/g, ' ').split(/\s+/).filter(Boolean); if(!w.length) return [];
  const res = [];
  TACO_IX.forEach((s, i) => { if(w.every(x => s.includes(x))){ const st = s.startsWith(w[0]) ? 0 : 1, cozido = /cozid|grelhad|assad|refogad/.test(s) ? 0 : /cru|crua/.test(s) ? 2 : 1; res.push([st, cozido, s.length, i]); } });
  res.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  return res.slice(0, max || 40).map(r => r[3]);
}
function tacoPorNome(n){ const s = semAc(n).trim(); const i = TACO.findIndex(t => semAc(t[0]) === s); return i >= 0 ? i : -1; }
function gramasDe(q){ const m = String(q || '').replace(',', '.').match(/(\d+(?:\.\d+)?)\s*(g|gramas?|ml)\b/i); return m ? +m[1] : null; }
function tacoKcal(i, g){ return Math.round(TACO[i][2] * g / 100); }
/* preenchimento automático: nome da TACO + quantidade em gramas = calorias */
function tacoAuto(nomeEl, qtdEl, kcalEl, apply){
  if(!nomeEl || !kcalEl) return; const i = tacoPorNome(nomeEl.value); if(i < 0) return;
  let g = qtdEl ? gramasDe(qtdEl.value) : null;
  if(qtdEl && !qtdEl.value.trim()){ qtdEl.value = '100 g'; g = 100; if(apply) apply(qtdEl); }
  if(g == null) g = 100;
  kcalEl.value = tacoKcal(i, g); if(apply) apply(kcalEl);
}
/* janela de busca */
function foodSheet(){
  const F = S.food; if(!F) return '';
  const it = F.sel != null ? TACO[F.sel] : null, g = F.g || 100;
  const lista = F.sel == null ? foodRes(F.q || '') : '';
  return `<div class="sheetbg" data-act="foodclose"></div><div class="sheet food" role="dialog" aria-label="Buscar alimento">
    <div class="sheeth"><b>${it ? 'Quanto você comeu?' : 'Buscar alimento'}</b><button class="ghost" data-act="${it ? 'foodvolta' : 'foodclose'}">${it ? 'Voltar' : 'Fechar'}</button></div>
    ${it ? `<div class="fsel"><b>${esc(it[0])}</b><div class="sub">${esc(TACO_CAT[it[1]])} · ${it[2]} kcal por 100 g</div>
      <label class="bf" for="fg" style="margin-top:10px"><span>Quantidade <small>gramas</small></span><input id="fg" inputmode="decimal" value="${g}" autocomplete="off"></label>
      <div class="opts" style="padding:8px 0 0" role="group" aria-label="Porções">${[50, 100, 150, 200, 300].map(v => `<button class="chip" data-act="foodg" data-g="${v}" aria-pressed="${g === v}">${v} g</button>`).join('')}</div>
      <div class="fcalc" id="fcalc">${foodCalc(F.sel, g)}</div>
      ${F.meal ? `<button class="primary" data-act="foodadd" data-m="${F.meal}" style="width:100%">Somar em ${esc((PLAN.find(m => m.id === F.meal) || {}).name || 'refeição')}</button>`
        : `<div class="sub" style="font-weight:700;margin:4px 0">Somar como extra em:</div><div class="fmeals">${PLAN.map(m => `<button class="ghost" data-act="foodadd" data-m="${m.id}">${esc(m.time ? m.time + ' · ' : '')}${esc(m.name)}</button>`).join('')}</div>`}
      <p class="tip" style="margin:6px 0 0">Valores da tabela TACO (Unicamp) para o alimento indicado. Preparos diferentes mudam as calorias.</p></div>`
    : `<input id="fq" class="ajin" placeholder="Ex.: arroz cozido, banana, frango grelhado" value="${esc(F.q || '')}" autocomplete="off" style="width:100%">
       <div class="fres" id="fres">${lista}</div>`}
  </div>`;
}
function foodRes(q){
  if(!q.trim()) return `<p class="sub" style="margin:8px 2px">Digite o nome do alimento. Dica: escreva o preparo, como "cozido" ou "grelhado".</p>`;
  const r = tacoBusca(q, 40);
  if(!r.length) return `<p class="sub" style="margin:8px 2px">Nada encontrado na tabela TACO. Tente outra palavra, ou some como extra digitando nome e calorias na refeição.</p>`;
  return r.map(i => `<button class="fr" data-act="foodsel" data-i="${i}"><span><b>${esc(TACO[i][0])}</b><small>${esc(TACO_CAT[TACO[i][1]])}</small></span><span class="num">${TACO[i][2]}<small> kcal/100 g</small></span></button>`).join('');
}
function foodCalc(i, g){
  const t = TACO[i], f = v => (Math.round(v * g / 100 * 10) / 10).toLocaleString('pt-BR');
  return `<div class="fk"><b class="num">${fmt(tacoKcal(i, g))}</b> kcal</div><div class="fm"><span>Proteína <b>${f(t[3])} g</b></span><span>Carbo <b>${f(t[4])} g</b></span><span>Gordura <b>${f(t[5])} g</b></span>${t[6] ? `<span>Fibra <b>${f(t[6])} g</b></span>` : ''}</div>`;
}
function foodAdd(mid){
  const F = S.food; if(!F || F.sel == null) return; const g = F.g || 100, t = TACO[F.sel];
  const r = rec(S.date, mid, true); r.extras = r.extras || []; r.extras.push({n:t[0] + ' (' + String(g).replace('.', ',') + ' g)', kcal:tacoKcal(F.sel, g), taco:F.sel, g});
  const m = PLAN.find(x => x.id === mid); S.food = null; save(S.date); toast('Somado em ' + ((m && m.name) || 'refeição') + ': ' + fmt(tacoKcal(F.sel, g)) + ' kcal'); render();
}
function foodInput(t){
  if(t.id === 'fq'){ S.food.q = t.value; const box = document.getElementById('fres'); if(box) box.innerHTML = foodRes(t.value); return true; }
  if(t.id === 'fg'){ const g = numv(t.value); S.food.g = g > 0 ? g : 100; const c = document.getElementById('fcalc'); if(c) c.innerHTML = foodCalc(S.food.sel, S.food.g); document.querySelectorAll('[data-act=foodg]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.g === S.food.g))); return true; }
  return false;
}

const WD_LONG = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'ex';
const numv = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const fmtClock = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const fmtRest = s => s >= 60 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' min' : s + ' s';

function validTreino(t){
  if(!t || !Array.isArray(t.fichas) || !t.fichas.length) return false;
  const hasWeeks = Array.isArray(t.semanas) && t.semanas.length && t.semanas.every(w => Array.isArray(w.s) && w.s.length);
  const exOk = e => e && e.n && (Array.isArray(e.s) ? e.s.length : hasWeeks);
  return t.fichas.every(f => f && f.id && Array.isArray(f.ex) && f.ex.length && f.ex.every(exOk)) && (!t.extras || (Array.isArray(t.extras) && t.extras.every(x => x && x.id && Array.isArray(x.ex) && x.ex.every(e => e && e.n && Array.isArray(e.s)))));
}
function fichaById(id){ return S.treino ? S.treino.fichas.find(f => f.id === id) : null; }
function semanaDe(date){
  const T = S.treino; if(!T || !T.inicio || !Array.isArray(T.semanas) || !T.semanas.length) return {n:0, w:null, fim:false, total:0};
  const n = Math.floor((parse(date) - parse(T.inicio)) / DAY_MS / 7) + 1, total = T.semanas.length;
  if(n < 1) return {n:1, w:T.semanas[0], fim:false, total, antes:true};
  return {n:Math.min(n, total), w:T.semanas[Math.min(n, total) - 1], fim:n > total, total};
}
function alvos(e, date){ const sc = Array.isArray(e.s) ? e.s : ((semanaDe(date).w || {}).s || [[3, '10']]); const out = []; sc.forEach(([q, r]) => { for(let i = 0; i < (+q || 0); i++) out.push(String(r)); }); return out; }
function alvoTxt(e, date){ const sc = Array.isArray(e.s) ? e.s : ((semanaDe(date).w || {}).s || []); return sc.map(([q, r]) => q + '×' + r).join(' + '); }
function sugeridas(e, date, n){
  const c = Array.isArray(e.c) ? e.c : (e.c != null ? [e.c] : []); if(!c.length) return [];
  if(c.length === n) return c.slice();
  const sc = Array.isArray(e.s) ? e.s : ((semanaDe(date).w || {}).s || []);

function descDe(e){ const T = S.treino || {}; if(e.t === 'mob' || e.t === 'cardio') return +e.desc || 0; return +e.desc || +((T.desc || {})[e.t]) || 90; }

function sessoes(date){ const d = S.days[date]; return d && Array.isArray(d.musc) ? d.musc : []; }
function setsOf(sess, grp, s){ if(!sess) return null; if(grp === 'ex') return (sess.ex || {})[s] || null; const id = grp.slice(4); return ((sess.ext || {})[id] || {})[s] || null; }
function okSets(arr){ return (arr || []).filter(x => x.ok && !x.aq); }
/* histórico de um exercício, do mais recente para o mais antigo */
function historico(s){
  const out = [];

    sessoes(date).slice().reverse().forEach(sess => {
      const all = [(sess.ex || {})[s]].concat(Object.values(sess.ext || {}).map(g => g[s]));

function extrasDoDia(date){

}
function novoSets(e, date, sessIni, comAquec){

function startSessao(fid){

  extrasDoDia(date).forEach(x => { sess.ext[x.id] = {}; x.ex.forEach(e => { sess.ext[x.id][slug(e.n)] = novoSets(e, date, ini, false); }); });
  const d = S.days[date] || (S.days[date] = {meals:{}}); d.musc = Array.isArray(d.musc) ? d.musc : []; d.musc.push(sess);

function sessAtual(){ return sessoes(S.date).find(x => x.ini === S.sessIni) || null; }
function addExtra(id){

function exDe(grp, s){
  if(grp === 'ex'){ const sess = sessAtual(), f = sess && fichaById(sess.f); return f ? f.ex.find(e => slug(e.n) === s) : null; }
  const x = ((S.treino || {}).extras || []).find(z => z.id === grp.slice(4)); return x ? x.ex.find(e => slug(e.n) === s) : null;
}
function toggleSet(grp, s, i){
  const sess = sessAtual(), arr = setsOf(sess, grp, s); if(!arr || !arr[i]) return;

    else x.pr = false;
    const allDone = Object.values(sess.ex || {}).concat(...Object.values(sess.ext || {}).map(g => Object.values(g))).every(a => a.every(y => y.ok));

function addSerie(grp, s){ const arr = setsOf(sessAtual(), grp, s); if(!arr) return; const last = arr[arr.length - 1] || {}; arr.push({t:last.t || '', kg:last.kg || '', r:'', ok:false}); save(S.date); render(); }

/* descanso, som e tela ligada */
let AC = null, WL = null, TICK = null;
function audioUnlock(){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); }catch(e){} }
function beep(){
  try{ if(AC){ [0, 0.28, 0.56].forEach(t => { const o = AC.createOscillator(), g = AC.createGain(), at = AC.currentTime + t; o.frequency.value = 880; o.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.35, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.22); o.start(at); o.stop(at + 0.25); }); } }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([250, 120, 250]); }catch(e){}
}
async function wakeOn(){ try{ if('wakeLock' in navigator && !WL) WL = await navigator.wakeLock.request('screen'); }catch(e){} }
function wakeOff(){ try{ if(WL) WL.release(); }catch(e){} WL = null; }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && S.mode === 'treino'){ WL = null; const s = sessAtual(); if(s && !s.fim) wakeOn(); } });
function startRest(sec, label){ S.rest = {end:Date.now() + sec * 1000, total:sec, label, done:false}; ensureTick(); }
function stopRest(){ S.rest = null; const el = document.getElementById('restbar'); if(el) el.hidden = true; }
function ensureTick(){ if(TICK) return; TICK = setInterval(tick, 250); }
function tick(){
  const clk = document.getElementById('sessclock'), sess = S.mode === 'treino' ? sessAtual() : null;
  if(clk && sess) clk.textContent = fmtClock(((sess.fim || Date.now()) - sess.ini) / 1000);
  const bar = document.getElementById('restbar');
  if(S.rest && bar){
    const left = (S.rest.end - Date.now()) / 1000;
    bar.hidden = false;
    if(left <= 0 && !S.rest.done){ S.rest.done = true; beep(); }
    const txt = bar.querySelector('.rt'), fill = bar.querySelector('.rfill');
    if(txt) txt.textContent = left > 0 ? fmtClock(left) : 'Hora da próxima série!';
    if(fill) fill.style.width = Math.max(0, Math.min(100, (1 - left / S.rest.total) * 100)) + '%';
    if(left < -6) stopRest();
  }
  if(!S.rest && !(S.mode === 'treino' && sess && !sess.fim)){ clearInterval(TICK); TICK = null; }
}

  const sel = S.progEx && list.some(x => x.s === S.progEx) ? S.progEx : (withData[0] || list[0]).s;
  const pts = historico(sel).slice().reverse().map(h => ({d:h.date, kg:Math.max(0, ...okSets(h.sets).map(x => numv(x.kg)))})).filter(p => p.kg > 0);

    const W = 340, H = 150, pl = 34, pr = 12, pt = 14, pb = 22, mn = Math.floor(Math.min(...pts.map(p => p.kg)) * 0.9), mx = Math.ceil(Math.max(...pts.map(p => p.kg)) * 1.08) || 1;
    const X = i => pts.length === 1 ? (pl + W - pr) / 2 : pl + i / (pts.length - 1) * (W - pl - pr), Y = v => pt + (mx - v) / ((mx - mn) || 1) * (H - pt - pb);

      <polyline points="${pts.map((p, i) => X(i).toFixed(1) + ',' + Y(p.kg).toFixed(1)).join(' ')}" fill="none" stroke="var(--fire)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="var(--fire)"/>`).join('')}
      <text x="${pl}" y="${H - 6}" font-size="10" fill="var(--muted)">${dl(pts[0].d)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end" font-size="10" fill="var(--muted)">${dl(pts[pts.length - 1].d)}</text>
    </svg><div class="sub num">Última: ${String(pts[pts.length - 1].kg).replace('.', ',')} kg${pts.length > 1 ? ` · primeira: ${String(pts[0].kg).replace('.', ',')} kg` : ''}</div>`;
  }
  const recs = list.map(x => ({...x, b:recorde(x.s)})).filter(x => x.b);
  return `<section class="card sum" aria-label="Evolução das cargas"><h2>Evolução das cargas</h2>
    <label class="sub" for="progsel" style="font-weight:700">Exercício</label><select id="progsel" class="admq">${opts}</select>${chart}</section>
   ${recs.length ? `<section class="card sum" aria-label="Recordes"><h2>Seus recordes</h2><div class="lines">${recs.map(x => `<div class="line"><span>${esc(x.n)}</span><span class="num">${String(x.b.kg).replace('.', ',')} kg × ${x.b.r || '–'}</span></div>`).join('')}</div></section>` : ''}`;
}
function muscStats(dates){
  let feitos = 0, previstos = 0, vol = 0; const td = today();
  dates.forEach(d => { if(!isRot() && plannedId(d) && d <= td) previstos++; sessoes(d).forEach(ss => { if(ss.fim){ feitos++; vol += resumoSessao(ss).vol; } }); });
  if(isRot()) previstos = Math.round((+S.treino.meta || S.treino.fichas.length) * dates.filter(d => d <= td).length / 7);
  return {feitos, previstos, vol};
}

async function importData(text){
  const out=document.getElementById('imsg'); const say=(t,ok)=>{S.imsg=t; S.imsgOk=!!ok; const el=document.getElementById('imsg'); if(el){el.textContent=t; el.className='lmsg'+(ok?' ok':'');}};
  let d; try{ d=JSON.parse((text||'').trim()); }catch(e){ say('Esse texto não é válido. Copie o texto inteiro, do { inicial até o } final.'); return; }
  if(!d||typeof d!=='object'||(!d.dias&&!d.plano&&!d.treino)){ say('Não encontrei plano, ficha de treino nem registros nesse texto.'); return; }
  if(d.treino&&!validTreino(d.treino)){ say('A ficha de treino desse texto está incompleta. Peça um novo texto da ficha.'); return; }
  if(d.plano&&!validPlan(d.plano)){ say('O plano desse texto está incompleto. Peça um novo texto do plano.'); return; }
  const orig=S.isAdmin?'prof':'proprio', trav=[];
  if(!S.isAdmin && d.plano && S.planOrig==='prof'){ delete d.plano; trav.push('plano'); }
  if(!S.isAdmin && d.treino && S.trnOrig==='prof'){ delete d.treino; trav.push('ficha de treino'); }
  if(trav.length && !d.dias){ say('Seu '+trav.join(' e ')+' é do profissional e só pode ser trocado pelo CheckFit. Fale com o suporte.'); return; }
  try{
    const b=FS.batch(); let n=0;
    if(d.plano) b.set(S.db.doc('config/plano'),{json:JSON.stringify(d.plano),origem:orig,atualizado:new Date().toISOString()});
    if(d.treino) b.set(S.db.doc('config/treino'),{json:JSON.stringify(d.treino),origem:orig,atualizado:new Date().toISOString()});
    Object.entries(d.dias||{}).forEach(([k,v])=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&v&&typeof v==='object'){ b.set(S.db.doc('dias/'+k),v); n++; } });
    if(d.perfil&&typeof d.perfil==='object') b.set(S.db.doc('config/perfil'),d.perfil);
    if(Array.isArray(d.alimentos)) b.set(S.db.doc('config/alimentos'),{lista:d.alimentos});
    await b.commit(); say(n?`Pronto: ${n} dia(s) importados${d.plano?' e plano':''}${d.treino?' e ficha de treino':''}.`:[d.plano?'Plano carregado.':'',d.treino?'Ficha de treino carregada.':''].filter(Boolean).join(' '),true);
    const ta=document.getElementById('impt'); if(ta) ta.value='';
  }catch(e){ say('Não consegui importar agora. Verifique a internet e tente de novo.'); }
}

function stats(dates){
  const cs=dates.map(d=>({d,c:dayCalc(d)})), logged=cs.filter(x=>x.c.status!=='vazio');
  const plano=cs.filter(x=>x.c.status==='plano').length, fora=cs.filter(x=>x.c.status==='fora').length;
  const avg=logged.length?logged.reduce((a,x)=>a+x.c.kcal,0)/logged.length:0;
  const mealsOk=logged.reduce((a,x)=>a+x.c.ok,0), mealsTot=logged.length*PLAN.length;

  let streak=0,best=0; cs.forEach(x=>{if(x.c.status==='plano'){streak++;best=Math.max(best,streak)}else if(x.d<=today())streak=0});
  const skipped=logged.reduce((a,x)=>a+x.c.meals.filter(m=>m.c.status==='skip').length,0);
  const waterDays=cs.filter(x=>x.c.waterOk).length, wl=cs.filter(x=>x.c.water>0), waterAvg=wl.length?wl.reduce((a,x)=>a+x.c.water,0)/wl.length:0;
  const trK=cs.reduce((a,x)=>a+x.c.tr.kcal,0), trN=cs.reduce((a,x)=>a+x.c.tr.list.length,0), trMin=cs.reduce((a,x)=>a+x.c.tr.min,0);
  const deficit=logged.reduce((a,x)=>a+(x.c.base?-x.c.saldo:0),0);
  const inP=weightList().filter(x=>x.d>=dates[0]&&x.d<=dates[dates.length-1]);
  const prev=weightList().filter(x=>x.d<dates[0]).pop();
  const wStart=prev?prev.w:(inP[0]&&inP[0].w), wEnd=inP.length?inP[inP.length-1].w:null, wDelta=(wStart&&wEnd)?wEnd-wStart:null;
  const mu=muscStats(dates);
  return {cs,logged,plano,fora,avg,mealsOk,mealsTot,extraK,top,best,skipped,waterDays,waterAvg,trK,trN,trMin,deficit,wDelta,wEnd,mu};
}

  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, mid=b.dataset.m, meal=PLAN.find(x=>x.id===mid), date=S.date;
  if(a==='admin'){S.mode=S.mode==='admin'?'app':'admin'; if(S.mode!=='admin') stopAdmin(); render(); window.scrollTo(0,0); return;}
  if(a==='adminback'){S.mode='app'; stopAdmin(); render(); window.scrollTo(0,0); return;}
  if(a==='legal'){S.prevMode=S.mode==='legal'?'app':S.mode; S.mode='legal'; S.legal=b.dataset.v; render(); window.scrollTo(0,0); return;}
  if(a==='legalback'){S.mode=S.prevMode||'app'; render(); window.scrollTo(0,0); return;}
  if(a==='copypix'){copyPix(); return;}
  if(a==='tstart'){startSessao(b.dataset.f); return;}
  if(a==='topen'){abrirSessao(+b.dataset.ini); return;}
  if(a==='tback'){S.mode='app'; S.confirmDiscard=false; render(); window.scrollTo(0,0); return;}
  if(a==='tfinish'){finishSessao(); return;}
  if(a==='tdiscard'){discardSessao(); return;}
  if(a==='treopen'){const ss=sessAtual(); if(ss){ ss.fim=null; const dd=S.days[S.date]; if(dd&&Array.isArray(dd.treinos)) dd.treinos=dd.treinos.filter(t=>t.sess!==ss.ini); wakeOn(); save(S.date); render(); } return;}
  if(a==='textra'){addExtra(b.dataset.x); return;}
  if(a==='setok'){audioUnlock(); toggleSet(b.dataset.g,b.dataset.s,+b.dataset.i); return;}
  if(a==='setadd'){addSerie(b.dataset.g,b.dataset.s); return;}
  if(a==='setdel'){delSerie(b.dataset.g,b.dataset.s); return;}
  if(a==='tprep'){const ss=sessAtual(); if(ss){ ss.prep=b.checked; save(S.date); } return;}
  if(a==='rplus'){ if(S.rest){ S.rest.end+=15000; S.rest.total+=15; S.rest.done=false; } return;}
  if(a==='rskip'){ stopRest(); return;}
  if(a==='delacct'){S.confirmDel=true; S.delMsg=''; render(); return;}
  if(a==='delno'){S.confirmDel=false; render(); return;}
  if(a==='delyes'){deleteAccount(); return;}
  if(a==='afilter'){A.f=b.dataset.v; render(); return;}
  if(a==='rel'){S.mode='rel'; S.relPdf=null; S.pdfNome=null; render(); window.scrollTo(0,0); return;}
  if(a==='bionova'){S.plus=false; S.bioDate=null; S.bioConf=null; S.mode='bio'; render(); window.scrollTo(0,0); return;}
  if(a==='bioedit'){S.bioDate=b.dataset.d; S.bioConf=null; S.mode='bio'; render(); window.scrollTo(0,0); return;}
  if(a==='bioback'){S.mode='app'; S.tab='evol'; render(); window.scrollTo(0,0); return;}
  if(a==='biodel'){bioDel(b.dataset.d); return;}
  if(a==='biorel'){S.bioRel=b.dataset.d; S.relPdf=null; S.pdfNome='Bioimpedancia-CheckFit-'+b.dataset.d.split('-').reverse().join('-')+'.pdf'; S.mode='biorel'; render(); window.scrollTo(0,0); return;}
  if(a==='bimgshare'){bimgShare(); return;}
  if(a==='biorelback'){S.mode='app'; S.tab='evol'; S.pdfNome=null; render(); window.scrollTo(0,0); return;}
  if(a==='relback'){S.mode='app'; render(); window.scrollTo(0,0); return;}
  if(a==='relpdf'){ relPdf(); return;}
  if(a==='relshare'){ relShare(); return;}
  if(a==='relprint'){ const t=document.getElementById('rel-nota'); if(t) relSetNota(t.value); try{ window.print(); }catch(err){} return;}
  if(a==='aed'){A.selfMsg=''; if(b.dataset.u) edOpen(b.dataset.u,b.dataset.k); return;}
  if(a==='ed'){edOp(b.dataset.op,b.dataset.p,b.dataset.i); return;}
  if(a==='edsave'){edSave(); return;}
  if(a==='edclose'){edClose(); return;}
  if(['a30','avit','ablock','aplan','aplansave','atrn','atrnsave'].includes(a)){adminAct(a,b.dataset.u); return;}
  if(a==='glogin'){googleLogin();return;}
  if(a==='signup'){emailSignup();return;}
  if(a==='reset'){emailReset();return;}
  if(a==='logout'){ if(AUTH) AUTH.signOut(); return; }
  if(a==='export'){exportData();return;}
  if(a==='import'){const t=document.getElementById('impt'); importData(t?t.value:''); return;}
  if(a==='tab'){S.view=b.dataset.v; if(S.view!=='dia') S.evolV=S.view; render();}
  if(a==='btab'){setTab(b.dataset.v); return;}
  if(a==='foodopen'){S.plus=false; S.food={q:'', meal:b.dataset.m||null, sel:null, g:100}; render(); setTimeout(()=>{ const q=document.getElementById('fq'); if(q) q.focus(); },60); return;}
  if(a==='foodclose'){S.food=null; render(); return;}
  if(a==='foodvolta'){S.food.sel=null; render(); setTimeout(()=>{ const q=document.getElementById('fq'); if(q) q.focus(); },60); return;}
  if(a==='foodsel'){S.food.sel=+b.dataset.i; S.food.g=100; render(); return;}
  if(a==='foodg'){S.food.g=+b.dataset.g; const fg=document.getElementById('fg'); if(fg) fg.value=S.food.g; foodInput(fg||{id:''}); return;}
  if(a==='foodadd'){foodAdd(b.dataset.m); return;}
  if(a==='majustes'){S.mode='aj'; S.ajKind=b.dataset.k; S.ajOpen=null; S.ajd=null; render(); window.scrollTo(0,0); return;}
  if(/^aj[a-z]/.test(a)){ajAct(a,b); return;}
  if(a==='plus'){S.plus=true; render(); return;}
  if(a==='plusclose'){S.plus=false; render(); return;}
  if(a==='plusw'){addWater(today(), +b.dataset.ml); toast('Água registrada: +'+b.dataset.ml+' ml'); return;}
  if(a==='plusgo'){plusGo(b.dataset.v); return;}
  if(a==='goMeal'){goMeal(b.dataset.m); return;}
  if(a==='ced'){edOpen(S.user.uid, b.dataset.k); return;}
  if(a==='caminho'){setCaminho(b.dataset.v); return;}
  if(a==='tema'){setTema(b.dataset.v); return;}
  else if(a==='prev'||a==='next'){const s=a==='prev'?-1:1; if(S.view==='dia')S.date=addDays(S.date,s); else if(S.view==='semana')S.date=addDays(S.date,7*s); else {const d=parse(S.date);S.date=ymd(new Date(d.getFullYear(),d.getMonth()+s,1));} render();}
  else if(a==='today'){S.date=today();render();}
  else if(a==='goday'){S.date=b.dataset.d;S.view='dia';render();window.scrollTo(0,0);}
  else if(a==='opt'){const r=rec(date,mid,true);r.opt=+b.dataset.o;save(date);render();}
  else if(a==='check'){setItem(date,mid,b.dataset.k,ir=>({...ir,on:!ir.on}));}
  else if(a==='choice'){setItem(date,mid,b.dataset.k,ir=>({...ir,c:+b.dataset.c,on:true}));}
  else if(a==='mult'){setItem(date,mid,b.dataset.k,ir=>({...ir,m:Math.min(4,Math.max(0.5,(ir.m||1)+(+b.dataset.d))),on:true}));}
  else if(a==='mealall'){markMeal(date,meal);save(date);render();}
  else if(a==='allplan'){PLAN.forEach(m=>markMeal(date,m));save(date);render();}
  else if(a==='skip'){const r=rec(date,mid,true);r.skip=!r.skip;save(date);render();}
  else if(a==='clear'){const d=S.days[date]; if(d&&d.meals){delete d.meals[mid];} save(date);render();}
  else if(a==='rmextra'){const r=rec(date,mid,true);r.extras.splice(+b.dataset.i,1);save(date);render();}
  else if(a==='water'){addWater(date,+b.dataset.ml);}
  else if(a==='wundo'){const d=S.days[date]; if(d&&Array.isArray(d.agua)&&d.agua.length){d.agua.pop();save(date);render();}}
  else if(a==='tquick'){const d=S.days[date]||(S.days[date]={meals:{}}); d.treinos=Array.isArray(d.treinos)?d.treinos:[]; d.treinos.push({t:b.dataset.t,min:60,i:1}); save(date); render();}
  else if(a==='rmtrain'){const d=S.days[date]; if(d&&Array.isArray(d.treinos)){d.treinos.splice(+b.dataset.i,1); save(date); render();}}
});
document.addEventListener('input',e=>{
  if(e.target.id && e.target.id.startsWith('xn-')){const k=lookupKcal(e.target.value); const kin=document.getElementById('xk-'+e.target.id.slice(3)); if(k!=null && kin) kin.value=k;}
});
function tfSync(e){const id=e.target.id; if(id==='tt')S.tf.t=e.target.value; else if(id==='tm')S.tf.min=parseFloat((e.target.value||'').replace(',','.'))||0; else if(id==='ti')S.tf.i=+e.target.value; else return; const el=document.getElementById('tprev'); if(el) el.innerHTML=tprevText();}
document.addEventListener('input',tfSync); document.addEventListener('change',tfSync);
document.addEventListener('click',e=>{const s=e.target.closest('details.prof > summary'); if(s) S.profOpen=!s.parentElement.open;});
function saveProf(){ if(S.db){ S.db.doc('config/perfil').set({...S.prof}).catch(()=>banner('Não consegui salvar seus dados agora.')); } else { try{localStorage.setItem('diario-perfil',JSON.stringify(S.prof));}catch(e){} } }
document.addEventListener('submit',e=>{
  const f=e.target; if(!f.matches('form.tform, form.pform, form#profform')) return; e.preventDefault();
  const date=S.date, num=id=>{const v=parseFloat((document.getElementById(id).value||'').replace(',','.')); return v>0?v:null;};
  if(f.matches('.tform')){ if(!(S.tf.min>0)){document.getElementById('tm').focus();return;} const d=S.days[date]||(S.days[date]={meals:{}}); d.treinos=Array.isArray(d.treinos)?d.treinos:[]; d.treinos.push({t:S.tf.t,min:Math.round(S.tf.min),i:S.tf.i}); save(date); render(); }
  else if(f.matches('.pform')){ const v=num('pw'); if(!v||v<30||v>300){document.getElementById('pw').focus();return;} const d=S.days[date]||(S.days[date]={meals:{}}); d.peso=Math.round(v*10)/10; save(date); render(); }
  else { S.prof={...S.prof, tmb:num('pf-tmb'), meta:num('pf-meta'), altura:num('pf-alt'), idade:num('pf-idade'), sexo:(document.getElementById('pf-sexo')||{}).value||'', agua:num('pf-agua'), pini:num('pf-pini'), dini:(document.getElementById('pf-dini')||{}).value||''}; saveProf(); S.profOpen=false; render(); }
});
function addWater(date,ml){if(!(ml>0))return; const d=S.days[date]||(S.days[date]={meals:{}}); d.agua=Array.isArray(d.agua)?d.agua:[]; d.agua.push(Math.round(ml)); save(date); render();}
document.addEventListener('submit',e=>{
  const f=e.target.closest('form.addw'); if(!f) return; e.preventDefault();
  const inp=document.getElementById('wml'), v=parseFloat((inp.value||'').replace(',','.'));
  if(!(v>0)){inp.focus();return;}
  addWater(S.date, v<=10 ? v*1000 : v);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form.addx'); if(!f) return; e.preventDefault();
  const mid=f.dataset.m, n=document.getElementById('xn-'+mid).value.trim(), kv=document.getElementById('xk-'+mid).value.replace(',','.');
  let k=parseFloat(kv); if(isNaN(k)) k=lookupKcal(n);
  if(!n){document.getElementById('xn-'+mid).focus();return;}
  if(k==null||isNaN(k)){banner(`Informe as calorias de "${n}" para somar no dia.`);document.getElementById('xk-'+mid).focus();return;}
  bannerMsg=S.local?bannerMsg:'';
  const r=rec(S.date,mid,true); r.extras=r.extras||[]; r.extras.push({n,kcal:Math.round(k)});
  if(!FOODS.some(x=>x[0].toLowerCase()===n.toLowerCase())){const i=S.custom.findIndex(x=>x.n.toLowerCase()===n.toLowerCase()); if(i>=0)S.custom[i].kcal=Math.round(k); else S.custom.push({n,kcal:Math.round(k)}); saveCustom(); fillFoods();}
  save(S.date); render();
});
document.addEventListener('submit',e=>{ const id=e.target.id; if(id==='emailform'){ e.preventDefault(); emailLogin(); } else if(id==='obform'){ e.preventDefault(); saveOnboard(); } else if(id==='cfgform'){ e.preventDefault(); saveConfig(); } });
document.addEventListener('input',e=>{ if(e.target.id==='admq'){ A.q=e.target.value; render(); } else if(e.target.dataset && e.target.dataset.sedit){ editSet(e.target); } });
document.addEventListener('change',e=>{ const t=e.target; if(t.id==='progsel'){ S.progEx=t.value; render(); } else if(t.dataset && t.dataset.fill && t.files && t.files[0]){ const r=new FileReader(), dest=t.dataset.fill; r.onload=()=>{ const ta=document.getElementById(dest); if(ta) ta.value=String(r.result||'').trim(); }; r.readAsText(t.files[0]); t.value=''; } });
document.addEventListener('click',e=>{ const s=e.target.closest('details.prof > summary'); if(s && S.mode==='admin') A.cfgOpen=!s.parentElement.open; });
document.addEventListener('change',e=>{ if(e.target.id==='impf' && e.target.files && e.target.files[0]){ const r=new FileReader(); r.onload=()=>importData(String(r.result||'')); r.readAsText(e.target.files[0]); e.target.value=''; } });
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset && t.dataset.ep && t.type!=='checkbox' && t.tagName!=='SELECT') edApply(t); });
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset && t.dataset.ep && (t.type==='checkbox' || t.tagName==='SELECT')){ edApply(t); if(t.dataset.ep.endsWith('.id') || t.tagName==='SELECT') render(); } });
document.addEventListener('click',e=>{ const s=e.target.closest('details.edd > summary'); if(s && A.ed){ const k=s.parentElement.dataset.ok; A.ed.open[k]=!s.parentElement.open; } });
document.addEventListener('submit',e=>{ if(e.target.id==='medform'){ e.preventDefault(); saveMedidas(S.date); } if(e.target.id==='bioform'){ e.preventDefault(); bioSave(); } });
document.addEventListener('change',e=>{ if(e.target.id==='bio-sexo'){ const m=document.getElementById('bio-sexomsg'); if(m) m.hidden=!!e.target.value; } if(e.target.id==='medsel'){ S.medEx=e.target.value; render(); } if(e.target.id==='biosel'){ S.bioEx=e.target.value; render(); } if(e.target.id==='bio-relsel'){ S.bioRel=e.target.value; S.relPdf=null; S.pdfNome='Bioimpedancia-CheckFit-'+e.target.value.split('-').reverse().join('-')+'.pdf'; render(); } });
document.addEventListener('input',e=>{ if(e.target.id==='rel-nota') relSetNota(e.target.value); });
document.addEventListener('click',e=>{ const s=e.target.closest('details.medd > summary'); if(s) S.medOpen=!s.parentElement.open; const bp=e.target.closest('#bio-pdfd > summary'); if(bp){ S.bioPdfOpen=!bp.parentElement.open; setTimeout(render,0); } const q=e.target.closest('details[data-aj] > summary'); if(q) S.ajOpen=q.parentElement.open?null:q.parentElement.dataset.aj; });
document.addEventListener('input',e=>{ const t=e.target; if(S.food && foodInput(t)) return;
  if(t.id==='ajtn'||t.id==='ajtq') tacoAuto(document.getElementById('ajtn'),document.getElementById('ajtq'),document.getElementById('ajtk'));
  const mo=t.id && t.id.match(/^ajo[nq](\d+)$/); if(mo) tacoAuto(document.getElementById('ajon'+mo[1]),document.getElementById('ajoq'+mo[1]),document.getElementById('ajok'+mo[1])); });
document.addEventListener('change',e=>{ const t=e.target, m=t.id && t.id.match(/^xn-(.+)$/); if(!m) return; const i=tacoPorNome(t.value), k=document.getElementById('xk-'+m[1]); if(i>=0 && k && !k.value){ t.value=TACO[i][0]+' (100 g)'; k.value=TACO[i][2]; } });
fillFoods();
init();
})();
</script>
</body>
</html>
